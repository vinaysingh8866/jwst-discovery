[package]
name = "jwst-discovery"
version = "0.1.0"
edition = "2021"
description = "Desktop app for the JWST NIRCam source discovery pipeline"

[lib]
name = "jwst_discovery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "io-util", "macros"] }

# Logging
log = "0.4"
env_logger = "0.11"

# UUID for request correlation
uuid = { version = "1", features = ["v4"] }

# Base64 encoding for binary file serving
base64 = "0.22"

# Home directory detection
dirs = "5"
