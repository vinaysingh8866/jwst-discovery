name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "sidecar[dev]" ruff
      - run: ruff check sidecar
      - run: cd sidecar && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Playwright: the real front end in headless Chromium with the Tauri IPC
  # mocked (src/e2e/mockTauri.ts), served under the packaged app's CSP. Also
  # regenerates docs/screenshots/. The sky-viewer spec pulls HiPS tiles from
  # CDS and retries itself twice; everything else is offline.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # bundle.resources makes tauri-build fail if the sidecar directory is absent;
      # a stub is enough for clippy/test.
      - run: bash scripts/build_sidecar.sh --stub
      - run: mkdir -p dist && cd src-tauri && cargo clippy --all-targets -- -D warnings && cargo test

  # Full packaged build (PyInstaller sidecar + `tauri build`).  Only on manual
  # dispatch or version tags: it takes ~20 min and uploads a ~400 MB bundle.
  release-build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: pip install -e "sidecar[dev]"
      - name: Build PyInstaller sidecar (src-tauri/sidecar-dist/jwst-pipeline/)
        run: bash scripts/build_sidecar.sh
      - name: Build Tauri app bundle
        run: npx tauri build --ci
      - name: Report bundle sizes
        run: |
          du -sh src-tauri/sidecar-dist/jwst-pipeline
          du -sh src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/*.app || true
      - uses: actions/upload-artifact@v4
        with:
          name: jwst-discovery-macos-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
